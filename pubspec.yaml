name: chat_toolkit
description: "A comprehensive and customizable chat widget toolkit for Flutter applications with message handling, real-time updates, and extensive customization options."
version: 2.3.0
repository: https://github.com/ws5260/chat_toolkit
issue_tracker: https://github.com/ws5260/chat_toolkit/issues
topics:
  - chat
  - ui
  - widget
  - messaging
  - flutter
screenshots:
  - description: The Chat Toolkit logo.
    path: doc/logo.png

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  gap: ^3.0.1
  intl: ^0.20.2
  material_ui: ^1.11.1
  super_sliver_list: ^0.4.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
